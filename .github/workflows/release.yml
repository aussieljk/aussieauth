name: Release

# Publishes @aussieljk/auth when a version tag is pushed, so npm always
# matches a commit on master:
#
#   cd packages/react && npm version minor
#   git commit -am "auth 0.2.0" && git tag v0.2.0 && git push origin master v0.2.0
#
# Needs an `NPM_TOKEN` repository secret (npmjs.com → Access Tokens →
# Automation).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/react
      # A tag must not ship a package that doesn't build, lint, or pass its
      # tests. These are the same checks CI runs on master; running them here
      # too means a tag pushed straight past a red CI still can't publish.
      - run: bunx playwright install --with-deps chromium
      - run: bun run generated:check
      - run: bun run lint
      - run: bun run test
      # Idempotent, so re-pushing a tag (or tagging a version that was already
      # published from a laptop) is a green no-op rather than a failed publish.
      - name: Publish if this version isn't on npm yet
        working-directory: packages/react
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@aussieljk/auth@$VERSION" version >/dev/null 2>&1; then
            echo "@aussieljk/auth@$VERSION is already on npm — nothing to publish."
          else
            bun publish --access public
          fi
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
