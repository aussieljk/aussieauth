<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Cosmos renderer</title>
  </head>
  <body>
    <!--
      Not the app's document — TanStack Start builds that from
      src/routes/__root.tsx. This is the entry react-cosmos insists on: it
      resolves one at the project root or refuses to start, and it only writes
      the file when it's missing, so this hand-written version survives.

      The script below is load-bearing: cosmos treats it as the entry and swaps
      its renderer in at that path, and without it the export builds nothing.
      It points at src/cosmos.main.tsx rather than the src/main.tsx cosmos
      generates, because that file is gone and vitest's browser server serves
      this same document — an unresolvable script there is a pre-transform
      error on every test run.
    -->
    <div id="root"></div>
    <script type="module" src="/src/cosmos.main.tsx"></script>
  </body>
</html>
