<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser to paint form controls and the pre-hydration canvas
         dark, so there's no white flash before React mounts. -->
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>AussieAuth</title>

    <meta
      name="description"
      content="A self-hosted auth server with sixteen sign-in methods and no consent screen of its own."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AussieAuth" />
    <meta property="og:url" content="https://aussieauth.com" />
    <meta property="og:title" content="AussieAuth" />
    <meta
      property="og:description"
      content="A self-hosted auth server with sixteen sign-in methods and no consent screen of its own."
    />
    <!-- Absolute, because scrapers don't resolve relative URLs. -->
    <meta
      property="og:image"
      content="https://aussieauth.com/opengraph-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AussieAuth" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AussieAuth" />
    <meta
      name="twitter:description"
      content="A self-hosted auth server with sixteen sign-in methods and no consent screen of its own."
    />
    <meta
      name="twitter:image"
      content="https://aussieauth.com/opengraph-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
